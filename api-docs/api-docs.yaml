      operationId: getExpenseById_1
      parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
    put:
      tags:
      - Expenses
      summary: Update an expense
      description: Updates the specified expense belonging to the authenticated user
        with the provided data.
      operationId: updateExpense
      parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
    delete:
      tags:
      - Expenses
      summary: Delete an expense
      description: Deletes the specified expense belonging to the authenticated user.
      operationId: deleteExpense
      parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/budgets/{budgetId}:
    get:
      tags:
      - Budgets
      summary: Get budget by ID
      description: Returns the specified budget belonging to the authenticated user.
      operationId: getBudgetById
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
    put:
      tags:
      - Budgets
      summary: Update a budget
      description: Updates the specified budget belonging to the authenticated user
        with the provided data.
      operationId: updateBudget
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
