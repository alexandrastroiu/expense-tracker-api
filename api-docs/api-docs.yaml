      operationId: createBudget
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: "Creates a new user account using the provided username, email,\
        \ and password."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in a user
      description: Authenticates a user using their username and password and returns
        a JWT token.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/recurringexpenses/search:
    get:
      tags:
      - Recurring Expenses
      summary: Search recurring expenses
      description: Returns the authenticated user's recurring expenses that match
        the specified search criteria.
      operationId: searchRecurringExpenses
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: frequency
        in: query
        required: false
        schema:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringExpenseResponse"
  /api/recurringexpenses/filter:
    get:
      tags:
      - Recurring Expenses
      summary: Filter recurring expenses
      description: Returns the authenticated user's recurring expenses that match
        the specified filter criteria.
      operationId: filterRecurringExpenses
      parameters:
      - name: minAmount
        in: query
        required: true
        schema:
          type: number
      - name: maxAmount
        in: query
        required: true
        schema:
          type: number
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringExpenseResponse"
  /api/expenses/search:
    get:
      tags:
      - Expenses
      summary: Search expenses
      description: Returns the authenticated user's expenses that match the specified
        search criteria.
      operationId: searchExpenses
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: expenseDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: amount
        in: query
        required: false
        schema:
          type: number
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseResponse"
  /api/categories:
    get:
      tags:
      - Categories
      summary: Get all expense categories
      description: Get all the expense categories.
      operationId: getAllCategories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
  /api/budgets/summary:
    get:
      tags:
      - Budgets
      summary: Get budget summary
      description: Returns a summary of the authenticated user's budget and expenses
        for the specified budget period.
      operationId: getBudgetSummary
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetSummaryResponse"
components:
  schemas:
    RecurringExpenseRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
        amount:
          type: number
          exclusiveMinimum: 0
        categoryId:
          type: integer
          format: int32
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
      required:
      - amount
      - categoryId
      - frequency
      - startDate
      - title
    RecurringExpenseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        categoryId:
          type: integer
          format: int32
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
    ExpenseRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
        amount:
          type: number
          exclusiveMinimum: 0
        categoryId:
          type: integer
          format: int32
        expenseDate:
          type: string
          format: date
      required:
      - amount
      - categoryId
      - expenseDate
      - title
    ExpenseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        categoryId:
          type: integer
          format: int32
        expenseDate:
          type: string
          format: date
    BudgetRequest:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        budgetPeriod:
          type: string
          format: date
      required:
      - amount
      - budgetPeriod
    BudgetResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        amount:
          type: number
        budgetPeriod:
          type: string
          format: date
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 0
        firstName:
          type: string
          maxLength: 50
          minLength: 0
        lastName:
          type: string
          maxLength: 50
          minLength: 0
        password:
          type: string
          maxLength: 255
          minLength: 0
        email:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - email
      - firstName
      - lastName
      - password
      - username
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 0
        password:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        categoryName:
          type: string
    BudgetSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        amount:
          type: number
        budgetPeriod:
          type: string
          format: date
        totalCurrentExpenses:
          type: number
        totalMonthlyExpenses:
          type: number
        remainingCurrentBudget:
          type: number
        remainingMonthlyBudget:
          type: number
        budgetPercentage:
          type: number
