      summary: Create an expense
      description: Creates a new expense for the authenticated user.
      operationId: createExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
  /api/budgets:
    get:
      tags:
      - Budgets
      summary: Get budget by period
      description: Returns the authenticated user's budget for the specified budget
        period.
      operationId: getBudgetByPeriod
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
    post:
      tags:
      - Budgets
      summary: Create a budget
      description: Creates a new budget for the authenticated user for the specified
