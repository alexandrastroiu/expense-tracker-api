      summary: Delete a recurring expense
      description: Deletes the specified recurring expense belonging to the authenticated
        user.
      operationId: deleteRecurringExpense
      parameters:
      - name: recurringExpenseId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
