        "401":
          description: "Missing, invalid, or expired bearer token"
      security:
      - bearerAuth: []
    put:
      tags:
      - Recurring Expenses
      summary: Update a recurring expense
      description: Updates the specified recurring expense belonging to the authenticated
        user with the provided data.
      operationId: updateRecurringExpense
      parameters:
      - name: recurringExpenseId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringExpenseRequest"
        required: true
      responses:
        "200":
          description: Recurring expense updated successfully
