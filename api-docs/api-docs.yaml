paths:
  /api/recurringexpenses/{recurringExpenseId}:
    get:
      tags:
      - Recurring Expenses
      summary: Get recurring expense by ID
      description: Returns the specified recurring expense belonging to the authenticated
        user.
      operationId: getExpenseById
      parameters:
      - name: recurringExpenseId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecurringExpenseResponse"
    put:
      tags:
      - Recurring Expenses
      summary: Update a recurring expense
      description: Updates the specified recurring expense belonging to the authenticated
        user with the provided data.
      operationId: updateRecurringExpense
      parameters:
      - name: recurringExpenseId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringExpenseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
