name: CI workflow

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Backend
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and run tests with Maven
        working-directory: backend
        run: ./mvnw clean test   # Run tests

      # Frontend
      - name: Set up node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Start the containers and run tests
      - name: Start the application
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

        run: docker compose -f docker-compose.yml up --build -d --wait    # Build before starting containers
                                                    # Wait for services to be healthy before running the next steps

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        env:
          BASE_URL: http://localhost:8080
        run: newman run postman/"Expense Manager API.postman_collection.json" --env-var "baseUrl=$BASE_URL"   # Run Postman API tests

      - name: Stop containers
        if: ${{ always() }}           # Always run this step
        run: docker compose -f docker-compose.yml down -v   # Stops and removes the containers, networks, volumes, images created