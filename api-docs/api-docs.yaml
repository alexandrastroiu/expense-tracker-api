                $ref: "#/components/schemas/BudgetResponse"
    delete:
      tags:
      - Budgets
      summary: Delete a budget
      description: Deletes the specified budget belonging to the authenticated user.
      operationId: deleteBudget
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/recurringexpenses:
    get:
      tags:
      - Recurring Expenses
      summary: Get all recurring expenses
      description: Returns all recurring expenses belonging to the authenticated user.
      operationId: getAllRecurringExpenses
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringExpenseResponse"
    post:
      tags:
      - Recurring Expenses
      summary: Create a recurring expense
      description: Creates a new recurring expense for the authenticated user.
      operationId: createRecurringExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringExpenseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecurringExpenseResponse"
  /api/expenses:
    get:
      tags:
      - Expenses
      summary: Get all expenses
      description: Returns all expenses belonging to the authenticated user.
      operationId: getExpenses
      parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: minAmount
        in: query
        required: false
        schema:
          type: number
      - name: maxAmount
        in: query
        required: false
        schema:
          type: number
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
